[package]
name = "polylock-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MPL-2.0"

[lib]
name = "polylock_core"
crate-type = ["rlib", "staticlib"]

[dependencies]
aes-gcm = "0.10"
concrete-ntt = "0.2"
falcon = { package = "falcon-rs", version = "0.2.5" }
hex = "0.4"
hmac = "0.12"
rand = "0.8"
rayon = "1.10"
reed-solomon = "0.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
